# Gera as 4 imagens Docker do sistema e publica no GHCR desta conta.
#
# Versão enxuta do pipeline: só amd64 (a arquitetura da VPS), sem testes
# automáticos (economiza os minutos gratuitos do GitHub em repositório privado).
# Os workflows originais estão guardados em .github/workflows-upstream-desativados/
# e NÃO rodam.
#
# Como usar:
#   - Manual: aba Actions > "Gerar imagens" > Run workflow > informe a versão.
#   - Automático: empurrar uma tag vX.Y.Z gera as imagens com esse número.
#
# Cada imagem sai com a tag do NÚMERO da versão (ex.: 1.102.0). A tag `stable`
# só é movida depois que as 4 imagens foram publicadas com sucesso.

name: Gerar imagens

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      versao:
        description: "Número da versão (ex.: 1.102.0)"
        required: true
        default: "1.102.0"

permissions:
  contents: read
  packages: write

concurrency:
  group: imagens-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  VERSAO: ${{ github.event_name == 'workflow_dispatch' && inputs.versao || github.ref_name }}

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: deskcommcrm
            dockerfile: Dockerfile
          - name: deskcomm-worker
            dockerfile: Dockerfile.worker
          - name: deskcomm-scheduler
            dockerfile: Dockerfile.scheduler
          - name: deskcomm-voice-agent
            dockerfile: Dockerfile.voice-agent
    steps:
      - uses: actions/checkout@v4

      - name: Normalizar versão
        id: ver
        run: echo "value=${VERSAO#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Construir e publicar ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}:${{ steps.ver.outputs.value }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  promover-stable:
    needs: construir
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Mover a tag stable para esta versão
        run: |
          v="${VERSAO#v}"
          base="${REGISTRY}/${{ github.repository_owner }}"
          for img in deskcommcrm deskcomm-worker deskcomm-scheduler deskcomm-voice-agent; do
            docker buildx imagetools create -t "$base/$img:stable" "$base/$img:$v"
          done
